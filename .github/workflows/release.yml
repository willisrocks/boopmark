name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-prepare
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the default branch
        run: test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
      - run: npm ci
      - name: Bump with npm SemVer
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName --jq '.[].tagName' | \
            grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
          test -n "$LATEST_TAG"
          CURRENT=${LATEST_TAG#v}
          npm version "$CURRENT" --no-git-tag-version --allow-same-version
          npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          REUSE_SHA=""
          RELEASE_DRAFT=$(gh release list --limit 1000 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"v$VERSION\") | .isDraft")
          if test -n "$RELEASE_DRAFT"; then
            test "$RELEASE_DRAFT" = true
            gh release view "v$VERSION" --json targetCommitish,isDraft > release-state.json
            REUSE_SHA=$(jq -r .targetCommitish release-state.json)
            printf '%s\n' "$REUSE_SHA" | grep -Eq '^[0-9a-f]{40}$'
            RELEASE_REF="refs/heads/release/v$VERSION"
            test "$(git ls-remote --heads origin "$RELEASE_REF" | awk '{print $1}')" = "$REUSE_SHA"
          else
            if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
              echo "tag v$VERSION exists without a resumable draft release" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "reuse_sha=$REUSE_SHA" >> "$GITHUB_OUTPUT"
      - name: Synchronize all product versions
        if: steps.release.outputs.reuse_sha == ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/release/sync-version.mjs "$VERSION" "$GITHUB_RUN_NUMBER"
          cargo metadata --format-version=1 >/dev/null
          cargo metadata --format-version=1 --locked >/dev/null
          node scripts/release/verify-version.mjs "$VERSION"
      - name: Commit release candidate source
        id: candidate
        env:
          REUSE_SHA: ${{ steps.release.outputs.reuse_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if test -n "$REUSE_SHA"; then
            SHA="$REUSE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json Cargo.lock cli/Cargo.toml server/Cargo.toml \
              extensions/chrome/manifest.json mobile/ios/project.yml \
              mobile/ios/Boopmark/Info.plist mobile/ios/BoopmarkShareExtension/Info.plist
            git commit -m "chore: release v$VERSION"
            RELEASE_REF="refs/heads/release/v$VERSION"
            REMOTE_SHA=$(git ls-remote --heads origin "$RELEASE_REF" | awk '{print $1}')
            if test -n "$REMOTE_SHA"; then
              git push --force-with-lease="$RELEASE_REF:$REMOTE_SHA" origin "HEAD:$RELEASE_REF"
            else
              git push origin "HEAD:$RELEASE_REF"
            fi
            SHA=$(git rev-parse HEAD)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh workflow run release-candidate.yml --ref "release/v$VERSION" -f prepared_sha="$SHA"
      - name: Wait for release candidate completion
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow release-candidate.yml --branch "release/v$VERSION" \
              --event workflow_dispatch --limit 20 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -1)
            test -n "$RUN_ID" && break
            sleep 2
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
