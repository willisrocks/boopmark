name: Release candidate

on:
  workflow_dispatch:

concurrency:
  group: release-candidate
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate candidate identity and versions
        id: candidate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release/verify-version.mjs "$VERSION"
          cargo metadata --format-version=1 --locked >/dev/null
          test "$GITHUB_REF" = "refs/heads/release/v$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    name: Full release validation
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Verify committed release version
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: |
          cargo metadata --format-version=1 --locked >/dev/null
          npm run release:verify -- "$VERSION"
      - run: npm run test:release
      - run: npm run test:extension
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  cli:
    name: CLI ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - {target: x86_64-apple-darwin, os: macos-latest}
          - {target: aarch64-apple-darwin, os: macos-latest}
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
        with: {key: "release-${{ matrix.target }}"}
      - run: cargo metadata --format-version=1 --locked >/dev/null
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --version 0.2.5
      - if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --release -p boop --target ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --locked --release -p boop --target ${{ matrix.target }}
      - name: Verify binary version
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: target/${{ matrix.target }}/release/boop --version | grep -F "$VERSION"
      - run: cp target/${{ matrix.target }}/release/boop boop-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: boop-${{ matrix.target }}
          if-no-files-found: error

  chrome:
    name: Chrome artifacts
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run test:extension
      - name: Build Web Store and sideload packages
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: |
          npm run extension:package
          test -f "dist/boopmark-chrome-$VERSION.zip"
          mkdir -p "dist/boopmark-chrome-unpacked-$VERSION"
          unzip -q "dist/boopmark-chrome-$VERSION.zip" -d "dist/boopmark-chrome-unpacked-$VERSION"
          test "$(node -p "require('./dist/boopmark-chrome-unpacked-$VERSION/manifest.json').version")" = "$VERSION"
          (cd dist && zip -X -q -r "boopmark-chrome-sideload-$VERSION.zip" "boopmark-chrome-unpacked-$VERSION")
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-${{ needs.metadata.outputs.version }}
          path: |
            dist/boopmark-chrome-${{ needs.metadata.outputs.version }}.zip
            dist/boopmark-chrome-sideload-${{ needs.metadata.outputs.version }}.zip
          if-no-files-found: error

  ios:
    name: iOS artifacts
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: brew install xcodegen
      - run: swift test --package-path mobile/ios/BoopmarkShared
      - name: Build iOS release packages
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: bash scripts/release/package-ios.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.metadata.outputs.version }}
          path: |
            dist/boopmark-ios-simulator-${{ needs.metadata.outputs.version }}.zip
            dist/boopmark-ios-unsigned-${{ needs.metadata.outputs.version }}.ipa
          if-no-files-found: error

  container:
    name: Versioned container
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.metadata.outputs.version }}
          build-args: |
            BOOPMARK_VERSION=${{ needs.metadata.outputs.version }}
            BOOPMARK_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy and verify production
    needs: [metadata, quality, cli, chrome, ios, container]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - run: npm install --global @railway/cli@4.42.1
      - name: Deploy exact release source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
          ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          SERVICE: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          railway variable --set "BOOPMARK_VERSION=$VERSION" --skip-deploys \
            --service "$SERVICE" --environment "$ENVIRONMENT"
          railway up --ci --environment "$ENVIRONMENT" --service "$SERVICE" \
            --message "Release v$VERSION (${{ github.sha }})"
      - name: Verify exact production version
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "https://boopmark.com/health?release=$GITHUB_RUN_ID" | grep -qx ok && \
               curl --fail --silent --show-error "https://boopmark.com/version?release=$GITHUB_RUN_ID" | \
                 jq --exit-status --arg version "$VERSION" '.version == $version' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "production did not report release $VERSION within 10 minutes" >&2
          exit 1

  promote:
    name: Promote production container
    needs: [metadata, deploy]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Point latest at the verified production image
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ needs.metadata.outputs.version }}"

  publish:
    name: Publish GitHub Release
    needs: [metadata, deploy, promote]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - name: Generate installation guide and checksums
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: |
          node scripts/release/generate-install.mjs "$VERSION" release/INSTALL.md "$GITHUB_REPOSITORY"
          expected=(
            boop-x86_64-apple-darwin boop-aarch64-apple-darwin
            boop-x86_64-unknown-linux-gnu boop-aarch64-unknown-linux-gnu
            "boopmark-chrome-$VERSION.zip" "boopmark-chrome-sideload-$VERSION.zip"
            "boopmark-ios-simulator-$VERSION.zip" "boopmark-ios-unsigned-$VERSION.ipa" INSTALL.md
          )
          for file in "${expected[@]}"; do test -f "release/$file"; done
          (cd release && sha256sum "${expected[@]}" > SHA256SUMS)
      - name: Tag release commit and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$RELEASE_SHA" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --target "$RELEASE_SHA" --title "Boopmark v$VERSION" \
            --generate-notes release/*
      - uses: actions/upload-artifact@v4
        with:
          name: boopmark-release-${{ needs.metadata.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 90
