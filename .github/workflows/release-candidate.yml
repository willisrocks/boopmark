name: Release candidate

on:
  workflow_dispatch:
    inputs:
      prepared_sha:
        description: Exact candidate commit created by the Release workflow
        required: true
        type: string

concurrency:
  group: release-candidate
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate candidate identity and versions
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_SHA: ${{ inputs.prepared_sha }}
        run: |
          printf '%s\n' "$PREPARED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_SHA" = "$PREPARED_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = 2
          PARENT=$(git rev-parse HEAD^)
          git merge-base --is-ancestor "$PARENT" origin/${{ github.event.repository.default_branch }}
          EXPECTED=$(printf '%s\n' \
            Cargo.lock cli/Cargo.toml extensions/chrome/manifest.json \
            mobile/ios/Boopmark/Info.plist mobile/ios/BoopmarkShareExtension/Info.plist \
            mobile/ios/project.yml package-lock.json package.json server/Cargo.toml | sort)
          ACTUAL=$(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "$ACTUAL" = "$EXPECTED"
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release/verify-version.mjs "$VERSION"
          cargo metadata --format-version=1 --locked >/dev/null
          test "$GITHUB_REF" = "refs/heads/release/v$VERSION"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA"
            gh release view "v$VERSION" --json targetCommitish,isDraft > release-state.json
            test "$(jq -r .targetCommitish release-state.json)" = "$GITHUB_SHA"
            test "$(jq -r .isDraft release-state.json)" = true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    name: Full release validation
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
      - name: Verify committed release version
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: |
          cargo metadata --format-version=1 --locked >/dev/null
          npm run release:verify -- "$VERSION"
      - run: npm run test:release
      - run: npm run test:extension
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  cli:
    name: CLI ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - {target: x86_64-apple-darwin, os: macos-latest}
          - {target: aarch64-apple-darwin, os: macos-latest}
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "${{ matrix.target }}"}
      - run: cargo metadata --format-version=1 --locked >/dev/null
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --version 0.2.5
      - if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --release -p boop --target ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --locked --release -p boop --target ${{ matrix.target }}
      - name: Verify binary version
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: target/${{ matrix.target }}/release/boop --version | grep -F "$VERSION"
      - run: cp target/${{ matrix.target }}/release/boop boop-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: boop-${{ matrix.target }}
          if-no-files-found: error

  chrome:
    name: Chrome artifacts
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
      - run: npm run test:extension
      - name: Build Web Store and sideload packages
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: |
          npm run extension:package
          test -f "dist/boopmark-chrome-$VERSION.zip"
          mkdir -p "dist/boopmark-chrome-unpacked-$VERSION"
          unzip -q "dist/boopmark-chrome-$VERSION.zip" -d "dist/boopmark-chrome-unpacked-$VERSION"
          test "$(node -p "require('./dist/boopmark-chrome-unpacked-$VERSION/manifest.json').version")" = "$VERSION"
          (cd dist && zip -X -q -r "boopmark-chrome-sideload-$VERSION.zip" "boopmark-chrome-unpacked-$VERSION")
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-${{ needs.metadata.outputs.version }}
          path: |
            dist/boopmark-chrome-${{ needs.metadata.outputs.version }}.zip
            dist/boopmark-chrome-sideload-${{ needs.metadata.outputs.version }}.zip
          if-no-files-found: error

  ios:
    name: iOS artifacts
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: brew install xcodegen
      - run: swift test --package-path mobile/ios/BoopmarkShared
      - name: Build iOS release packages
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: bash scripts/release/package-ios.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.metadata.outputs.version }}
          path: |
            dist/boopmark-ios-simulator-${{ needs.metadata.outputs.version }}.zip
            dist/boopmark-ios-unsigned-${{ needs.metadata.outputs.version }}.ipa
          if-no-files-found: error

  container:
    name: Versioned container
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.metadata.outputs.version }}
          build-args: |
            BOOPMARK_VERSION=${{ needs.metadata.outputs.version }}
            BOOPMARK_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy and verify production
    needs: [metadata, quality, cli, chrome, ios, container]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with: {version: 0.4.115}
      - name: Deploy exact release image
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.metadata.outputs.version }}
        run: flyctl deploy --app boopmark --image "$IMAGE"
      - name: Report Fly state when the deploy step fails
        if: failure() && steps.deploy.outcome == 'failure'
        env: {FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}"}
        run: |
          app=boopmark
          flyctl status --app "$app" 2>&1 || true
          flyctl machine list --app "$app" --json 2>/dev/null |
            jq -r '.[] | [.id, .state, (.config.image // ""), (.instance_id // "")] | @tsv' || true
          flyctl logs --app "$app" --no-tail 2>&1 | tail -n 60 || true
      - name: Verify exact production version
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          app=boopmark
          started_at=$(date -u +%s)
          # Fail fast only on evidence that the release cannot start: a machine in a
          # failed state, a non-zero exit event, a crash loop, or no release machine
          # left running. The first minute is boot grace, so a slow but healthy
          # rollout keeps the full ten-minute window either way.
          grace_seconds=60
          declare -A instance_seen=()
          declare -A restarts=()

          machine_rows() {
            flyctl machine list --app "$app" --json 2>/dev/null |
              jq -r '.[] | [.id, .state, (.config.image // ""), (.instance_id // "")] | @tsv' || true
          }

          # Only app-owned output: the machine state, the projected machine table and
          # the app's own log lines. Never dump secret or machine config listings.
          fail_with_diagnostics() {
            echo "::error::$1" >&2
            echo "--- flyctl status ---" >&2
            flyctl status --app "$app" 2>&1 || true
            flyctl status --app "$app" --json 2>/dev/null |
              jq -r '(.Machines // {}) | to_entries[] | "\(.key)\t\(.value.state // "unknown")"' 2>/dev/null || true
            echo "--- flyctl machine list (id state image instance) ---" >&2
            machine_rows >&2
            # Diagnostic only: the release image may be recorded by digest, so this
            # never decides the outcome.
            flyctl machine list --app "$app" --json 2>/dev/null |
              jq -r --arg tag ":$VERSION" \
                '"machines reporting an image: \([.[]? | select((.config.image // "") != "")] | length), carrying \($tag): \([.[]? | select((.config.image // "") | contains($tag))] | length)"' 2>/dev/null || true
            echo "--- last app log lines ---" >&2
            flyctl logs --app "$app" --no-tail 2>&1 | tail -n 60 || true
            exit 1
          }

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "https://boopmark.com/health?release=$GITHUB_RUN_ID" | grep -qx ok && \
               curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "https://boopmark.com/version?release=$GITHUB_RUN_ID" | \
                 jq --exit-status --arg version "$VERSION" '.version == $version' >/dev/null; then
              echo "production serves $VERSION"
              exit 0
            fi

            elapsed=$SECONDS
            if (( elapsed >= grace_seconds )); then
              machines=$(flyctl machine list --app "$app" --json 2>/dev/null || printf '[]')
              # Release machines only, with the last exit event's code. Nothing else
              # from the machine config is read here, so no secret can reach the log.
              analysis=$(printf '%s' "$machines" | jq -r --arg tag ":$VERSION" '
                def epoch: (.timestamp // null)
                  | if type == "number"
                    then (if . > 1e11 then (. / 1000 | floor) else . end)
                    elif type == "string"
                    then (try (sub("\\.[0-9]+"; "") | fromdateiso8601) catch null)
                    else null end;
                .[]
                | select((.config.image // "") | contains($tag))
                # Fly updates a machine in place, so .events still holds the exit of the
                # process from the previous release (often 143/137/-1 after a deploy
                # stop). Only the newest event can describe this rollout, so sort by
                # time instead of trusting array order.
                | (([(.events // [])[] | select(.timestamp != null)]
                     | sort_by(epoch // 0) | last) // {}) as $newest
                | [ .id,
                    (.state // "unknown"),
                    (.instance_id // ""),
                    ($newest.type // ""),
                    (($newest.request.exit_event.exit_code
                      // $newest.request.exit_event.guest_exit_code // 0) | tostring),
                    (($newest | epoch) // 0 | tostring)
                  ]
                | @tsv' 2>/dev/null || true)

              matched=0
              running=0
              in_flight=0
              breakage=""
              while IFS=$'\t' read -r id state instance event_type exit_code event_at; do
                test -n "${id:-}" || continue
                matched=$(( matched + 1 ))
                case "$state" in
                  created|starting|started) running=$(( running + 1 )) ;;
                  stopping|replacing) in_flight=$(( in_flight + 1 )) ;;
                  failed|crashed|destroyed) breakage="${breakage:+$breakage; }$id is $state" ;;
                esac
                # The current instance died and nothing started since, in this rollout.
                if test "${event_type:-}" = exit && test "${exit_code:-0}" -ne 0 &&
                   test "${event_at:-0}" -ge "$started_at"; then
                  breakage="${breakage:+$breakage; }$id exited with code $exit_code"
                fi
                # A machine whose instance id keeps changing is crash looping.
                case "$state" in
                  starting|started)
                    previous=${instance_seen[$id]:-}
                    instance_seen[$id]=$instance
                    if test -n "$previous" && test "$previous" != "$instance"; then
                      restarts[$id]=$(( ${restarts[$id]:-0} + 1 ))
                      if (( restarts[$id] >= 2 )); then
                        breakage="${breakage:+$breakage; }$id restarted ${restarts[$id]} times"
                      fi
                    fi ;;
                esac
              done <<< "$analysis"

              if test -n "$breakage"; then
                fail_with_diagnostics "release machine cannot start: $breakage"
              fi
              # Scaled-to-zero machines are normal (auto_stop_machines with
              # min_machines_running=1), so this fails only when no release machine
              # is serving and none is still moving.
              if (( matched > 0 && running == 0 && in_flight == 0 )); then
                fail_with_diagnostics "no machine is running the $VERSION release"
              fi
            fi

            sleep 10
          done
          fail_with_diagnostics "production did not serve $VERSION within 10 minutes"

  publish:
    name: Stage GitHub Release
    needs: [metadata, deploy]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: chrome-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-*
          path: release
          merge-multiple: true
      - name: Generate installation guide and checksums
        env: {VERSION: "${{ needs.metadata.outputs.version }}"}
        run: |
          node scripts/release/generate-install.mjs "$VERSION" release/INSTALL.md "$GITHUB_REPOSITORY"
          expected=(
            boop-x86_64-apple-darwin boop-aarch64-apple-darwin
            boop-x86_64-unknown-linux-gnu boop-aarch64-unknown-linux-gnu
            "boopmark-chrome-$VERSION.zip" "boopmark-chrome-sideload-$VERSION.zip"
            "boopmark-ios-simulator-$VERSION.zip" "boopmark-ios-unsigned-$VERSION.ipa" INSTALL.md
          )
          for file in "${expected[@]}"; do test -f "release/$file"; done
          (cd release && sha256sum "${expected[@]}" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: boopmark-release-${{ needs.metadata.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Create or repair exact draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "v$VERSION" --json targetCommitish,isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .targetCommitish release-state.json)" = "$RELEASE_SHA"
            test "$(jq -r .isDraft release-state.json)" = true
            gh release upload "v$VERSION" release/* --clobber
          else
            gh release create "v$VERSION" --target "$RELEASE_SHA" --title "Boopmark v$VERSION" \
              --generate-notes --draft release/*
          fi

  promote:
    name: Promote production container
    needs: [metadata, deploy, publish]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Point latest at the verified production image
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ needs.metadata.outputs.version }}"

  finalize:
    name: Publish GitHub Release
    needs: [metadata, publish, promote]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - name: Publish the staged release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$RELEASE_SHA"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
