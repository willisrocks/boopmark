{% for bookmark in bookmarks %}
{% include "bookmarks/card.html" %}
{% endfor %}
{% if bookmarks.is_empty() %}
<div class="col-span-full text-center py-12 text-gray-500">
    No bookmarks found.
</div>
{% endif %}
{% if capped %}
<div class="col-span-full text-center py-4 text-xs text-gray-500" data-testid="search-cap-notice">
    Showing the 50 most relevant
</div>
{% endif %}
