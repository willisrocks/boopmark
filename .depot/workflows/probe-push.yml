# THROWAWAY: push trigger probe. A later commit on this branch removes this file.
name: Probe push trigger

on:
  workflow_dispatch:
    inputs:
      target:
        description: Branch to create, under release/vprobe-
        required: true
        type: string

jobs:
  push-branch:
    runs-on: depot-ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push a commit with the Depot token
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in release/vprobe-*) ;; *) exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "probe: push from Depot token"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "pushed $(git rev-parse HEAD) to $TARGET"
      - name: Report what the token can read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version | head -1
          gh release list --repo willisrocks/boopmark --limit 1 --json tagName --jq '.[].tagName' || echo "release list failed"
          gh run list --repo willisrocks/boopmark --workflow ci.yml --limit 1 --json databaseId --jq 'length' || echo "run list failed"
