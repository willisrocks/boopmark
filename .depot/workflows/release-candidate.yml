# THROWAWAY: secret scope probe. A later commit on this branch removes this file.
name: Probe scope release-candidate

on:
  push:
    branches: ['release/vprobe-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  env-production:
    runs-on: depot-ubuntu-latest
    environment: production
    steps:
      - env: {V: "${{ secrets.PROBE_SCOPE }}", E: "${{ github.event_name }}", A: "${{ github.actor }}"}
        run: |
          if test -n "$V"; then echo "PROBE=set"; else echo "PROBE=empty"; fi
          echo "file=release-candidate.yml env=production ref=$GITHUB_REF event=$E event_var=$GITHUB_EVENT_NAME actor=$A head=$GITHUB_HEAD_REF"
  env-none:
    runs-on: depot-ubuntu-latest
    steps:
      - env: {V: "${{ secrets.PROBE_SCOPE }}"}
        run: |
          if test -n "$V"; then echo "PROBE=set"; else echo "PROBE=empty"; fi
          echo "file=release-candidate.yml env=none ref=$GITHUB_REF"
  env-other:
    runs-on: depot-ubuntu-latest
    environment: staging
    steps:
      - env: {V: "${{ secrets.PROBE_SCOPE }}"}
        run: |
          if test -n "$V"; then echo "PROBE=set"; else echo "PROBE=empty"; fi
          echo "file=release-candidate.yml env=staging ref=$GITHUB_REF"
