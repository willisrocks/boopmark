[package]
name = "boopmark-server"
version = "0.8.0"
edition = "2024"
license.workspace = true

[dependencies]
axum.workspace = true
axum-extra.workspace = true
sqlx.workspace = true
askama.workspace = true
askama_axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
scraper.workspace = true
aws-sdk-s3.workspace = true
aws-config.workspace = true
tower.workspace = true
tower-http.workspace = true
argon2.workspace = true
rand.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
url.workspace = true
sha2.workspace = true
trait-variant.workspace = true
csv.workspace = true
tokio-stream.workspace = true
urlencoding.workspace = true
base64 = "0.22"
ring = "0.17"
image.workspace = true
dom_smoothie = "0.19.0"
# Local embeddings (EMBEDDING_BACKEND=local); ONNX Runtime is loaded at run
# time from ORT_DYLIB_PATH, so the build downloads no native binaries.
fastembed = { version = "7.5", optional = true, default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

[features]
local-embeddings = ["dep:fastembed"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
